
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Pendaftaran Workshop</h1>
        <p>Silakan isi formulir berikut.</p>

        <form id="formWorkshop" novalidate>
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" maxlength="40">
            <small id="hitungNama">0/40 karakter</small>

            <label for="email">Email</label>
            <input type="text" id="email">

            <label for="sesi">Pilih Sesi Workshop</label>
            <select id="sesi">
                <option value="">-- Pilih sesi --</option>
                <option value="Pagi">Sesi Pagi (09.00–12.00)</option>
                <option value="Siang">Sesi Siang (13.00–16.00)</option>
            </select>

            <p id="ringkasan"></p>
            <p id="pesan"></p>

            <button type="submit">Daftar Workshop</button>
            <button type="reset" class="reset">Reset</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
